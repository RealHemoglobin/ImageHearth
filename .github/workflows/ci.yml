name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --wheel
      - name: Install the wheel in a separate environment
        run: |
          uv venv "$RUNNER_TEMP/wheel-env"
          uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl pytest
      - name: Check that the package comes from site-packages
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "import imagehearth_mcp, sys; print(imagehearth_mcp.__file__); sys.exit('site-packages' not in imagehearth_mcp.__file__)"
      - name: Run the tests against the installed wheel
        run: "$RUNNER_TEMP/wheel-env/bin/python" -m pytest tests
