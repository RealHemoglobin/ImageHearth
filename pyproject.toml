[project]
name = "imagehearth"
version = "0.0.0"
description = "MCP server that lets AI agents generate and edit images locally through ComfyUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.30,<2",
    "pillow>=13,<14",
    "requests>=2.34,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

# Solo entorno de desarrollo: el empaquetado llega en la fase 1.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
# Restaurar Ollama es limpieza final: cualquier fallo se convierte en aviso
# para no perder la imagen ya generada.
"engine/orchestrator.py" = ["BLE001"]
# Los llamadores capturan ValueError; pasar a TypeError cambiaría el comportamiento.
"engine/validation.py" = ["TRY004"]
# Se conserva el orden con el que ComfyUI carga el nodo: importa sus módulos internos.
"extras/comfyui_custom_nodes/imageengine_status/__init__.py" = ["I001"]
