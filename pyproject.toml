[project]
name = "imagehearth-mcp"
version = "0.1.0b1"
description = "MCP server that lets AI agents generate and edit images locally through ComfyUI"
readme = "README.md"
license = "MIT AND GPL-3.0-only"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/imagehearth_mcp/data/imagehearth_status/LICENSE",
]
requires-python = ">=3.13"
authors = [{ name = "Hemoglobin" }]
keywords = ["mcp", "model-context-protocol", "comfyui", "image-generation", "flux", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "filelock>=4.2.5",
    "huggingface-hub>=1,<3",
    "mcp>=1.30,<2",
    "pillow>=13,<14",
    "platformdirs>=4,<5",
    "psutil>=7.2.2",
    "pyyaml>=6,<7",
    "requests>=2.34,<3",
]

[project.urls]
Homepage = "https://github.com/RealHemoglobin/ImageHearth"
Documentation = "https://github.com/RealHemoglobin/ImageHearth#readme"
Issues = "https://github.com/RealHemoglobin/ImageHearth/issues"
Changelog = "https://github.com/RealHemoglobin/ImageHearth/blob/main/CHANGELOG.md"

[project.scripts]
imagehearth-mcp = "imagehearth_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagehearth_mcp"]

# Lista cerrada: sin ella, el sdist incluye specs/ y cualquier archivo no ignorado.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/README.es.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Windows no usa UTF-8 por defecto: open() sin encoding es un fallo.
extend-select = ["PLW1514"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# Restaurar Ollama es limpieza final: cualquier fallo se convierte en aviso
# para no perder la imagen ya generada.
"src/imagehearth_mcp/engine/orchestrator.py" = ["BLE001"]
# La prueba de humo informa de cualquier fallo del motor, sea cual sea la capa.
"src/imagehearth_mcp/provisioner/smoke.py" = ["BLE001"]
# Los llamadores capturan ValueError; pasar a TypeError cambiaría el comportamiento.
"src/imagehearth_mcp/engine/validation.py" = ["TRY004"]
# Se conserva el orden con el que ComfyUI carga el nodo: importa sus módulos internos.
"src/imagehearth_mcp/data/imagehearth_status/__init__.py" = ["I001"]
