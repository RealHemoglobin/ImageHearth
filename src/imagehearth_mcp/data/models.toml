# Lo que instala `imagehearth-mcp setup`. Cada valor está fijado y comprobado:
# cambiar una versión aquí es lo que hace que `update` la aplique.

[comfyui]
version = "0.43.0"
url = "https://github.com/Comfy-Org/ComfyUI/archive/refs/tags/v0.43.0.tar.gz"
sha256 = "8a496a7d82bd343cafdb2b867857fe8c5140e3cd9ec5cf46c6277ccb7466f202"
license = "comfyui"
# ComfyUI (0,2 GB) y su entorno con PyTorch CUDA (7 GB).
install_bytes = 7200000000

[pytorch.cu130]
python = "3.13"
index = "https://download.pytorch.org/whl/cu130"
packages = ["torch==2.14.1+cu130", "torchvision==0.29.1+cu130", "torchaudio==2.11.0+cu130"]
min_driver = 580

[pytorch.cu126]
python = "3.12"
index = "https://download.pytorch.org/whl/cu126"
packages = ["torch==2.14.1+cu126", "torchvision==0.29.1+cu126", "torchaudio==2.11.0+cu126"]

[pytorch."rocm7.2"]
python = "3.13"
index = "https://download.pytorch.org/whl/rocm7.2"
packages = ["torch==2.14.1+rocm7.2", "torchvision==0.29.1+rocm7.2", "torchaudio==2.11.0+rocm7.2"]

[pytorch.xpu]
python = "3.13"
index = "https://download.pytorch.org/whl/xpu"
packages = ["torch==2.15.0+xpu", "torchvision==0.29.2+xpu", "torchaudio==2.11.1+xpu"]

[pytorch.cpu]
python = "3.13"
index = "https://download.pytorch.org/whl/cpu"
packages = ["torch==2.15.0+cpu", "torchvision==0.29.2+cpu", "torchaudio==2.11.1+cpu"]

# Sin índice propio: la versión estable de PyPI ya incluye MPS. Sin probar en un Mac.
[pytorch.metal]
python = "3.13"
index = "https://pypi.org/simple"
packages = ["torch==2.14.1", "torchvision==0.29.1", "torchaudio==2.11.0"]
# Estimación a partir de los wheels de macOS en PyPI: sin medir en un Mac.
install_bytes = 2500000000

[nodes.comfyui-gguf]
folder = "ComfyUI-GGUF"
url = "https://github.com/city96/ComfyUI-GGUF/archive/6ea2651e7df66d7585f6ffee804b20e92fb38b8a.tar.gz"
sha256 = "688126d5c2b8c4ff061f56b23c3c6791ac01dc366e98d41ef1aaef374c36f283"
license = "apache-2"
packages = ["gguf==0.19.0", "sentencepiece==0.2.2", "protobuf==7.36.2"]

[licenses.comfyui]
name = "GPL-3.0"
url = "https://github.com/Comfy-Org/ComfyUI/blob/master/LICENSE"
summary = "ComfyUI, the separate program that runs the models."

[licenses.sai-community]
