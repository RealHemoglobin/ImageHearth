# Lo que instala `imagehearth-mcp setup`. Cada valor está fijado y comprobado:
# cambiar una versión aquí es lo que hace que `update` la aplique.

[comfyui]
version = "0.43.0"
url = "https://github.com/Comfy-Org/ComfyUI/archive/refs/tags/v0.43.0.tar.gz"
sha256 = "8a496a7d82bd343cafdb2b867857fe8c5140e3cd9ec5cf46c6277ccb7466f202"
license = "comfyui"
# ComfyUI (0,2 GB) y su entorno con PyTorch CUDA (7 GB).
install_bytes = 7200000000

[pytorch.cu130]
python = "3.13"
index = "https://download.pytorch.org/whl/cu130"
packages = ["torch==2.14.1+cu130", "torchvision==0.29.1+cu130", "torchaudio==2.11.0+cu130"]
min_driver = 580

[pytorch.cu126]
python = "3.12"
index = "https://download.pytorch.org/whl/cu126"
packages = ["torch==2.14.1+cu126", "torchvision==0.29.1+cu126", "torchaudio==2.11.0+cu126"]

[pytorch."rocm7.2"]
python = "3.13"
index = "https://download.pytorch.org/whl/rocm7.2"
packages = ["torch==2.14.1+rocm7.2", "torchvision==0.29.1+rocm7.2", "torchaudio==2.11.0+rocm7.2"]

# AMD en Windows: paquetes de AMD, no de PyTorch. Su índice tiene también las
# dependencias, y cada arquitectura gfx lleva su extra [device-...]. Sin probar en
# una Radeon; resuelto con uv para Windows y Python 3.13. El tamaño se estima con
# los wheels (1,5 GB de descarga) y no está medido.

[pytorch.rocm-win-gfx1200]
python = "3.13"
index = "https://stable.repo.amd.com/rocm/whl-next/"
packages = ["torch[device-gfx1200]==2.14.0+rocm10.1.0", "torchvision[device-gfx1200]==0.29.0a0+rocm10.1.0", "torchaudio==2.11.0.3+rocm10.1.0"]
install_bytes = 5000000000

[pytorch.rocm-win-gfx1201]
python = "3.13"
index = "https://stable.repo.amd.com/rocm/whl-next/"
packages = ["torch[device-gfx1201]==2.14.0+rocm10.1.0", "torchvision[device-gfx1201]==0.29.0a0+rocm10.1.0", "torchaudio==2.11.0.3+rocm10.1.0"]
install_bytes = 5000000000

[pytorch.rocm-win-gfx1100]
python = "3.13"
index = "https://stable.repo.amd.com/rocm/whl-next/"
packages = ["torch[device-gfx1100]==2.14.0+rocm10.1.0", "torchvision[device-gfx1100]==0.29.0a0+rocm10.1.0", "torchaudio==2.11.0.3+rocm10.1.0"]
install_bytes = 5000000000

[pytorch.rocm-win-gfx1101]
python = "3.13"
index = "https://stable.repo.amd.com/rocm/whl-next/"
packages = ["torch[device-gfx1101]==2.14.0+rocm10.1.0", "torchvision[device-gfx1101]==0.29.0a0+rocm10.1.0", "torchaudio==2.11.0.3+rocm10.1.0"]
install_bytes = 5000000000

[pytorch.rocm-win-gfx1102]
python = "3.13"
index = "https://stable.repo.amd.com/rocm/whl-next/"
packages = ["torch[device-gfx1102]==2.14.0+rocm10.1.0", "torchvision[device-gfx1102]==0.29.0a0+rocm10.1.0", "torchaudio==2.11.0.3+rocm10.1.0"]
install_bytes = 5000000000

[pytorch.rocm-win-gfx1103]
python = "3.13"
index = "https://stable.repo.amd.com/rocm/whl-next/"
packages = ["torch[device-gfx1103]==2.14.0+rocm10.1.0", "torchvision[device-gfx1103]==0.29.0a0+rocm10.1.0", "torchaudio==2.11.0.3+rocm10.1.0"]
