[profiles.fast]
description = "Quick generation with SDXL Turbo"
platforms = ["linux", "windows"]
min_vram_mib = 8000
models = ["sdxl_turbo"]

[profiles.quality]
description = "fast + high-quality generation with FLUX Dev"
platforms = ["linux", "windows"]
min_vram_mib = 20000
models = ["sdxl_turbo", "flux_dev", "t5xxl", "clip_l", "flux_vae"]

[profiles.full]
description = "quality + image editing with FLUX Kontext"
platforms = ["linux", "windows"]
min_vram_mib = 20000
models = ["sdxl_turbo", "flux_dev", "t5xxl", "clip_l", "flux_vae", "flux_kontext"]

# Variants for less VRAM. `setup` picks the one that fits; ComfyUI loads by parts into RAM what
# doesn't fit. The minimums are a starting point until they are measured on a smaller card.
[profiles.quality-gguf]
description = "fast + high-quality generation with FLUX Dev GGUF Q5, for 12 to 20 GB of VRAM"
platforms = ["linux", "windows"]
variant_of = "quality"
min_vram_mib = 12000
models = ["sdxl_turbo", "flux_dev_gguf", "t5xxl_gguf", "clip_l", "flux_vae"]
nodes = ["comfyui-gguf"]

[profiles.quality-sdxl]
description = "fast + high-quality generation with a fine-tuned SDXL (RealVisXL) and a detail LoRA, for 8 to 12 GB of VRAM"
platforms = ["linux", "windows"]
variant_of = "quality"
min_vram_mib = 8000
models = ["sdxl_turbo", "realvisxl", "sdxl_offset_lora"]

[profiles.full-gguf]
description = "quality + image editing with FLUX Kontext GGUF Q5, for 12 to 20 GB of VRAM"
platforms = ["linux", "windows"]
variant_of = "full"
min_vram_mib = 12000
models = ["sdxl_turbo", "flux_dev_gguf", "t5xxl_gguf", "clip_l", "flux_vae", "flux_kontext_gguf"]
nodes = ["comfyui-gguf"]

