[profiles.fast]
description = "Quick generation with SDXL Turbo"
platforms = ["linux", "windows"]
min_vram_mib = 8000
models = ["sdxl_turbo"]

# `quality` and `full` don't name a quality model: the user picks one of [quality_models.*]
# (or setup recommends it for the GPU) and `full` adds the editing model of [edit].
[profiles.quality]
description = "fast + high-quality generation"
platforms = ["linux", "windows"]
min_vram_mib = 8000
models = ["sdxl_turbo"]
quality = true

[profiles.full]
description = "quality + image editing with FLUX Kontext"
platforms = ["linux", "windows"]
min_vram_mib = 12000
models = ["sdxl_turbo"]
quality = true
edit = true

# Models of the quality profile. Only one is installed at a time. Each has options by
# precision, from most to least VRAM; `setup` picks the one that fits. The minimums are
# a starting point until they are measured on a smaller card (phase 9, task 10.5).
# `recommended_from_mib` is the GPU memory from which setup recommends the model.
[quality_models.flux-dev]
title = "FLUX.1 Dev"
license = "flux-dev-non-commercial"
recommended_from_mib = 20000

[[quality_models.flux-dev.options]]
precision = "fp8"
min_vram_mib = 20000
workflow = "flux_dev"
models = ["flux_dev"]

[[quality_models.flux-dev.options]]
precision = "gguf"
min_vram_mib = 12000
workflow = "flux_dev_gguf"
models = ["flux_dev_gguf"]
nodes = ["comfyui-gguf"]

[quality_models.flux-schnell]
title = "FLUX.1 Schnell"
license = "apache-2"
